<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bg-danger text-white text-center py-3">
    <h1>Hospital Management System</h1>
</header>

<nav class="nav justify-content-center bg-light py-2 border-bottom">
    <a class="nav-link fw-bold" href="index.html">Home</a>
    <a class="nav-link fw-bold" href="login.html">Login</a>
    <a class="nav-link fw-bold" href="catalogue.html">Catalogue</a>
    <a class="nav-link active fw-bold" href="registration.html">Registration</a>
</nav>

<div class="container my-4">
    <div class="card mx-auto p-4" style="max-width: 500px;">
        <h2 class="text-center text-danger mb-3">Patient Registration</h2>
        
        <!-- Alert Box for Validation Messages -->
        <div id="formAlert" class="alert d-none"></div>

        <form id="registrationForm" onsubmit="return validateRegistrationForm(event)">
            <div class="mb-2">
                <label class="form-label">Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Enter full name">
            </div>

            <div class="mb-2">
                <label class="form-label">Mobile Number</label>
                <input type="text" id="mobile" class="form-control" placeholder="10-digit mobile number">
            </div>

            <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="name@example.com">
            </div>

            <div class="mb-2">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="At least 6 characters">
            </div>

            <div class="mb-2">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password">
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label>
                <select id="gender" class="form-select">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit" class="btn btn-danger w-100">Register</button>
        </form>
    </div>
</div>

<footer class="bg-danger text-white text-center py-2 fixed-bottom">
    Hospital Management System
</footer>

<script src="script.js"></script>
</body>
</html>
